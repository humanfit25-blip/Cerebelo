<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06090e">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CEREBELO">
<title>CEREBELO Tracks Beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: cabecera tipográfica + marcador táctico; barra sticky con conmutador de vertiente y días; debajo, la sesión del día como hoja de 4 bloques. Mundo único oscuro (obsidiana / titanio / hielo). */
:root{
  color-scheme: dark;
  --obsidian:#030712;      /* fondo */
  --obsidian-2:#06090e;    /* fondo barra */
  --titanium:#0d131f;      /* paneles */
  --titanium-2:#111827;    /* paneles elevados */
  --line:#1e293b;          /* bordes */
  --white:#f8fafc;         /* texto principal */
  --silver:#94a3b8;        /* texto secundario */
  --silver-2:#64748b;      /* texto terciario */
  --ice:#00d4ff;           /* acento */
  --ice-soft:rgba(0,212,255,.12);
  --emerald:#00ff88;       /* estado activo / completado */
  --emerald-soft:rgba(0,255,136,.10);
  --forge:#00d4ff;         /* fuerza: en tracks neutros = acento */
  --forge-2:#7fe9ff;
  --forge-soft:rgba(0,212,255,.10);
  --dock:var(--obsidian-2);
  --f-display:"Syne","Arial Black",Helvetica,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ===== Tokens registrados: permiten que el color se funda entre universos ===== */
@property --obsidian{syntax:"<color>";inherits:true;initial-value:#030712}
@property --obsidian-2{syntax:"<color>";inherits:true;initial-value:#06090e}
@property --titanium{syntax:"<color>";inherits:true;initial-value:#0d131f}
@property --titanium-2{syntax:"<color>";inherits:true;initial-value:#111827}
@property --line{syntax:"<color>";inherits:true;initial-value:#1e293b}
@property --white{syntax:"<color>";inherits:true;initial-value:#f8fafc}
@property --silver{syntax:"<color>";inherits:true;initial-value:#94a3b8}
@property --silver-2{syntax:"<color>";inherits:true;initial-value:#64748b}
@property --ice{syntax:"<color>";inherits:true;initial-value:#00d4ff}
@property --ice-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --forge{syntax:"<color>";inherits:true;initial-value:#00d4ff}
@property --forge-2{syntax:"<color>";inherits:true;initial-value:#7fe9ff}
@property --forge-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --emerald{syntax:"<color>";inherits:true;initial-value:#00ff88}
@property --emerald-soft{syntax:"<color>";inherits:true;initial-value:transparent}
@property --dock{syntax:"<color>";inherits:true;initial-value:#06090e}
@property --star{syntax:"<color>";inherits:true;initial-value:#dbe8ff}
body{transition:--obsidian .9s ease,--obsidian-2 .9s ease,--titanium .9s ease,--titanium-2 .9s ease,--line .9s ease,--white .9s ease,
  --silver .9s ease,--silver-2 .9s ease,--ice .9s ease,--ice-soft .9s ease,--forge .9s ease,--forge-2 .9s ease,--forge-soft .9s ease,
  --emerald .9s ease,--emerald-soft .9s ease,--dock .9s ease,--star .9s ease,background-color .9s ease}

/* ===== TEMA GÉNESIS · Titanio Cerámico / Bienestar Nórdico (modo claro) ===== */
body[data-theme="aurora"]{
  color-scheme: light;
  --obsidian:#f1f5f9;               /* titanio ártico */
  --obsidian-2:#f8fafc;             /* porcelana */
  --titanium:#ffffff;
  --titanium-2:#ffffff;
  --line:#e2e8f0;                   /* borde mineral */
  --white:#0f172a;                  /* carbón grafito: texto principal */
  --silver:#475569;                 /* pizarra medio */
  --silver-2:#64748b;               /* ceniza */
  --ice:#059669;                    /* esmeralda orgánico */
  --ice-soft:rgba(5,150,105,.09);
  --forge:#0d9488;                  /* aguamarina suave: fuerza */
  --forge-2:#0f766e;
  --forge-soft:rgba(13,148,136,.06);
  --emerald:#059669;
  --emerald-soft:rgba(5,150,105,.09);
  --dock:rgba(248,250,252,.88);
  --star:rgba(255,255,255,0);
}
body[data-theme="aurora"] .stars{opacity:0}
body[data-theme="aurora"] .dock{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
body[data-theme="aurora"] :is(.board,.tracks,.blk,.dy,.donebtn,.pager button){box-shadow:0 4px 20px rgba(15,23,42,.04)}
body[data-theme="aurora"] .kg input{background:#ffffff;border-color:#cbd5e1}
body[data-theme="aurora"] .dy .h{color:#ffffff}
body[data-theme="aurora"] .blk.k-str{background:linear-gradient(160deg,var(--forge-soft),transparent 55%),#ffffff}

/* ===== TEMA HYBRID MUSCLE · Deep Cobalt Space ===== */
body[data-theme="cobalt"]{
  --obsidian:#020617;
  --obsidian-2:#030d22;
  --titanium:rgba(5,18,48,.80);
  --titanium-2:rgba(9,28,70,.86);
  --line:#173064;
  --silver:#9fb3d1;
  --silver-2:#6b82a8;
  --ice:#3d9bff;                    /* azul eléctrico activo */
  --ice-soft:rgba(0,82,204,.30);
  --forge:#ff8400;                  /* ámbar forja: tensión mecánica */
  --forge-2:#ff9f1c;
  --forge-soft:rgba(255,132,0,.12);
  --dock:rgba(3,13,34,.86);
}
/* ===== TEMA APEX ATHLETE · Solar Flare ===== */
body[data-theme="solar"]{
  --obsidian:#080202;
  --obsidian-2:#0c0303;
  --titanium:rgba(24,7,5,.80);
  --titanium-2:rgba(40,11,7,.86);
  --line:#3b1610;
  --white:#fff8f2;
  --silver:#cdb0a5;
  --silver-2:#93736a;
  --ice:#ff6600;                    /* naranja eléctrico activo */
  --ice-soft:rgba(255,102,0,.16);
  --forge:#ffb700;                  /* oro solar: fuerza */
  --forge-2:#ffd24a;
  --forge-soft:rgba(255,183,0,.11);
  --emerald:#ffb700;                /* completado en oro */
  --emerald-soft:rgba(255,183,0,.12);
  --dock:rgba(12,3,3,.86);
  --star:#ffc98a;
}
*{box-sizing:border-box}
html{background:var(--obsidian)}
body{background:var(--obsidian);color:var(--white);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--obsidian-2)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;position:relative;z-index:1}

/* ===== COSMOS (solo tema cobalto) ===== */
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none}
.neb{position:absolute;inset:-10%;opacity:0;transition:opacity 1.2s ease;animation:nebdrift 40s ease-in-out infinite alternate}
body[data-theme="aurora"] .n-aurora,body[data-theme="cobalt"] .n-cobalt,body[data-theme="solar"] .n-solar{opacity:1}
.n-aurora{background:
  radial-gradient(75% 20% at 28% 14%,rgba(16,185,129,.10),transparent 70%),
  radial-gradient(60% 16% at 74% 24%,rgba(45,212,191,.09),transparent 70%),
  radial-gradient(45% 26% at 50% 38%,rgba(167,243,208,.16),transparent 72%),
  radial-gradient(55% 34% at 12% 80%,rgba(13,148,136,.06),transparent 70%),
  radial-gradient(50% 36% at 88% 88%,rgba(94,234,212,.08),transparent 70%),
  linear-gradient(180deg,#f8fafc 0%,#f1f5f9 60%,#eef3f6 100%);
  animation:aurora 28s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(0,0,0) skewY(0deg)}50%{transform:translate3d(2%,-1.5%,0) skewY(-1.5deg) scale(1.03)}100%{transform:translate3d(-2%,1%,0) skewY(1deg)}}
.n-solar{background:
  radial-gradient(34% 26% at 50% 32%,rgba(255,85,0,.22),transparent 70%),
  radial-gradient(26% 20% at 58% 28%,rgba(255,183,0,.08),transparent 70%),
  radial-gradient(55% 40% at 18% 72%,rgba(179,18,23,.24),transparent 72%),
  radial-gradient(45% 35% at 88% 78%,rgba(255,85,0,.12),transparent 70%),
  radial-gradient(120% 90% at 50% 40%,#120403 0%,#080202 70%)}
.n-cobalt{background:
  radial-gradient(38% 30% at 50% 34%,rgba(0,82,204,.34),transparent 70%),
  radial-gradient(30% 24% at 62% 30%,rgba(0,212,255,.10),transparent 70%),
  radial-gradient(55% 40% at 22% 70%,rgba(0,51,170,.26),transparent 72%),
  radial-gradient(45% 35% at 85% 80%,rgba(0,82,204,.18),transparent 70%),
  radial-gradient(120% 90% at 50% 40%,#030d22 0%,#020617 70%)}
@keyframes nebdrift{to{transform:translate3d(-2%,1.5%,0) scale(1.04)}}
.stars{position:absolute;inset:0;transition:opacity .9s ease}
.stars i{position:absolute;border-radius:50%;background:var(--star);opacity:.15;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.75}}
.mono{font-family:var(--f-mono)}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-2)}

/* ===== CABECERA ===== */
.head{padding-block:34px 22px}
.head{position:relative;overflow:hidden}
.hero{position:relative;min-height:clamp(70px,14vw,110px)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,9.6vw,78px);letter-spacing:.05em;line-height:1;margin:0;text-wrap:balance}
.board{position:relative;z-index:1}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--silver);margin-top:12px;text-transform:uppercase}
.tag b{color:var(--ice);font-weight:500}

/* marcador */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:26px;border:1px solid var(--line);background:var(--titanium)}
.cell{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.cell:last-child{border-right:0}
.cell .v{font-family:var(--f-mono);font-weight:700;font-size:clamp(16px,3.2vw,22px);letter-spacing:.04em;margin-top:4px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v.ice{color:var(--ice)}
.phase{display:flex;gap:3px;margin-top:8px}
.phase i{flex:1;height:3px;background:var(--line)}
.phase i.on{background:var(--ice)}

/* ===== BARRA STICKY ===== */
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--dock);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:12px 10px}
.dock-in{max-width:960px;margin:0 auto;display:grid;gap:10px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--titanium);border:1px solid var(--line)}
.tr{border:0;background:transparent;padding:8px 6px;text-align:left;min-width:0;border-radius:2px;transition:background .2s,color .2s}
.tr .c{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--silver-2);white-space:nowrap}
.tr .c em{font-style:normal}
.tr .n{display:block;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--silver);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr:hover .n{color:var(--white)}
.tr[aria-selected="true"]{background:var(--ice-soft);box-shadow:inset 0 -2px 0 var(--ice)}
.tr[aria-selected="true"] .n{color:var(--white)}
.tr[aria-selected="true"] .c{color:var(--ice)}
.days{display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.dy{flex:1 0 64px;border:1px solid var(--line);background:var(--titanium);padding:7px 6px;text-align:center;position:relative;transition:border-color .2s,background .2s}
.dy .d{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--silver)}
.dy .k{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.dy .h{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;
  background:var(--ice);color:var(--obsidian);padding:0 5px;font-weight:700}
.dy.done::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--emerald);box-shadow:0 0 6px var(--emerald)}
.dy[aria-selected="true"]{border-color:var(--ice);background:var(--ice-soft)}
.dy[aria-selected="true"] .d{color:var(--ice)}

/* ===== VERTIENTE ===== */
.trackinfo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end;padding-block:26px 18px;border-bottom:1px solid var(--line)}
.trackinfo{position:relative;overflow:hidden}
.trackinfo h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5.6vw,40px);letter-spacing:.02em;line-height:1;margin:6px 0 8px;text-wrap:balance}
/* púlsar + respiración (tema cobalto) */
.pulsar{position:relative;display:inline-block;margin:6px 0 8px;isolation:isolate}
.pulsar h2{margin:0;position:relative;z-index:1}
.pulsar .ring{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;
  border:1px solid rgba(61,155,255,.75);box-shadow:0 0 14px rgba(0,82,204,.55),inset 0 0 10px rgba(0,212,255,.25);
  opacity:0;z-index:0;animation:pulsar 4.8s cubic-bezier(.2,.6,.3,1) infinite}
.pulsar .ring:nth-child(2){animation-delay:1.6s;border-color:rgba(255,159,28,.6);box-shadow:0 0 14px rgba(255,132,0,.35)}
.pulsar .ring:nth-child(3){animation-delay:3.2s}
.pulsar .core{position:absolute;left:50%;top:50%;width:160px;height:60px;margin:-30px 0 0 -80px;border-radius:50%;z-index:0;
  background:radial-gradient(closest-side,rgba(0,82,204,.45),rgba(0,51,170,.12) 60%,transparent);animation:corebeat 4.8s ease-in-out infinite}
@keyframes pulsar{0%{transform:scale(.25);opacity:0}12%{opacity:.85}100%{transform:scale(4.2);opacity:0}}
@keyframes corebeat{0%,100%{opacity:.6;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
.breath{background:linear-gradient(90deg,#f8fafc 0%,#cfe4ff 45%,#ffc27a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:breath 4.6s ease-in-out infinite}
/* púlsar de vitalidad: ondas lentas y fluidas, respiración celular */
/* onda acuática: anillos translúcidos sobre fondo claro, sin neón */
.pulsar.aurora .ring{border:1.5px solid rgba(5,150,105,.25);box-shadow:0 0 12px rgba(5,150,105,.06),inset 0 0 10px rgba(16,185,129,.05);
  animation:cell 7.5s ease-in-out infinite}
.pulsar.aurora .ring:nth-child(2){animation-delay:2.5s;border-color:rgba(16,185,129,.15)}
.pulsar.aurora .ring:nth-child(3){animation-delay:5s;border-color:rgba(13,148,136,.20)}
.pulsar.aurora .core{background:radial-gradient(closest-side,rgba(134,179,140,.28),rgba(167,243,208,.12) 60%,transparent);animation:corebeat 7.5s ease-in-out infinite}
@keyframes cell{0%{transform:scale(.3);opacity:0}25%{opacity:1}100%{transform:scale(3.6);opacity:0}}
.crystal{background:linear-gradient(100deg,#047857 0%,#065f46 35%,#059669 75%,#0d9488 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:crystal 6s ease-in-out infinite}
@keyframes crystal{
  0%,100%{opacity:.9;filter:drop-shadow(0 2px 6px rgba(5,150,105,.10))}
  50%{opacity:1;filter:drop-shadow(0 3px 12px rgba(5,150,105,.24))}}
/* transiciones suaves de superficies */
.tr,.dy,.blk,.chip,.cell,.board,.donebtn,.blk-h .ix,.timeline i{transition:background-color .9s ease,border-color .9s ease,color .9s ease,box-shadow .9s ease}
/* púlsar solar: ráfagas de tres ondas de choque y pausa */
.pulsar.solar .ring{border-color:rgba(255,183,0,.85);box-shadow:0 0 16px rgba(255,102,0,.6),inset 0 0 10px rgba(255,230,0,.3);
  animation:shock 3.2s cubic-bezier(.15,.7,.3,1) infinite}
.pulsar.solar .ring:nth-child(2){animation-delay:.32s;border-color:rgba(255,102,0,.8);box-shadow:0 0 16px rgba(179,18,23,.55)}
.pulsar.solar .ring:nth-child(3){animation-delay:.64s;border-color:rgba(255,230,0,.7)}
.pulsar.solar .core{background:radial-gradient(closest-side,rgba(255,85,0,.42),rgba(179,18,23,.14) 60%,transparent);animation:corebeat 3.2s ease-in-out infinite}
@keyframes shock{0%{transform:scale(.2);opacity:0}4%{opacity:.95}42%{transform:scale(4.4);opacity:0}100%{transform:scale(4.4);opacity:0}}
.thermal{background:linear-gradient(95deg,#ffe600 0%,#ffb700 38%,#ff7a00 70%,#ff4800 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:thermal 4.8s ease-in-out infinite}
@keyframes thermal{
  0%,100%{opacity:.82;filter:drop-shadow(0 0 3px rgba(255,72,0,.35))}
  50%{opacity:1;filter:drop-shadow(0 0 10px rgba(255,140,0,.7)) drop-shadow(0 0 24px rgba(179,18,23,.55))}}
@keyframes breath{
  0%,100%{opacity:.8;filter:drop-shadow(0 0 4px rgba(0,82,204,.35))}
  50%{opacity:1;filter:drop-shadow(0 0 12px rgba(61,155,255,.75)) drop-shadow(0 0 26px rgba(0,82,204,.55))}}
.trackinfo p{margin:0;color:var(--silver);max-width:62ch}
.specs{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:3px 8px;border:1px solid var(--line);color:var(--silver);white-space:nowrap}
.chip.ice{color:var(--ice);border-color:color-mix(in srgb,var(--ice) 45%,transparent)}

/* ===== SESIÓN DEL DÍA ===== */
.dayhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:24px 16px}
.dayhead h3{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,44px);letter-spacing:.03em;line-height:1;margin:6px 0 6px;text-transform:uppercase}
.dayhead .obj{color:var(--silver);margin:0;max-width:62ch}
.donebtn{border:1px solid var(--line);background:var(--titanium);padding:10px 14px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--silver);white-space:nowrap;transition:all .2s}
.donebtn:hover{border-color:var(--emerald);color:var(--emerald)}
.donebtn[aria-pressed="true"]{background:var(--emerald-soft);border-color:var(--emerald);color:var(--emerald)}

.timeline{display:flex;height:6px;gap:2px;margin-bottom:18px}
.timeline i{background:var(--line);height:100%}
.timeline i.ice{background:var(--ice)}
.timeline i.ice2{background:var(--ice);opacity:.55}
.timeline i.forge{background:var(--forge);box-shadow:0 0 8px var(--forge-soft)}
/* bloque de fuerza: tensión mecánica en ámbar forja */
.blk.k-str{border-color:color-mix(in srgb,var(--forge) 38%,var(--line));
  background:linear-gradient(160deg,var(--forge-soft),transparent 55%),var(--titanium)}
.blk.k-str .ix{color:var(--forge);border-color:color-mix(in srgb,var(--forge) 55%,transparent)}
.blk.k-str .rx .l{color:var(--forge-2);border-color:color-mix(in srgb,var(--forge) 40%,var(--line))}
.blk.k-str .kg input:focus{border-color:var(--forge)}
.blk.k-str .cue{border-left-color:var(--forge);background:linear-gradient(90deg,var(--forge-soft),transparent 70%)}

.blocks{display:grid;gap:12px}
.blk{border:1px solid var(--line);background:var(--titanium)}
.blk-h{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 16px;background:transparent;border:0;text-align:left}
.blk-h .ix{font-family:var(--f-mono);font-size:12px;color:var(--ice);border:1px solid color-mix(in srgb,var(--ice) 45%,transparent);padding:2px 7px;font-variant-numeric:tabular-nums}
.blk-h .t{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;min-width:0}
.blk-h .t small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;color:var(--silver);margin-top:1px}

              { n: "Remo suave", p: "4′" },
              { n: "Rutina completa de movilidad dinámica de tobillo, cadera y muñeca", p: "5′" },
              { n: "Aproximaciones técnicas de Snatch y Clean", p: "3′" }
            ]},
            { k: "str", dur: 22, sub: "Olympic Test", items: [
              { n: "Test 1RM: Snatch (Arrancada)", p: "15′ para encontrar la marca del día", nt: "Anotar el levantamiento más pesado válido", log: true }
            ], cue: "<b>Check de Rendimiento:</b> Tienes 15 minutos. Busca un levantamiento sólido sin fallar intentos por debajo del 90%." },
            { k: "met", dur: 16, fmt: "The Benchmark Gauntlet · For Time (Cap 15′)", sub: "Anota tu tiempo total en el cuaderno", items: [
              { n: "Calorías Echo Bike", p: "30/24 Cal" },
              { n: "Squat Clean and Jerk", p: "20 reps", l: "61/43 kg" },
              { n: "Chest-to-Bar Pull-ups", p: "30 reps" },
              { n: "Burpees over the bar", p: "20 reps" },
              { n: "Calorías Remo", p: "30/24 Cal" },
              { n: "Tiempo total del Gauntlet", p: "Cap 15′", nt: "Tu marca de referencia para el próximo bloque", log: true, lu: "TIEMPO" }
            ]},
            { k: "acc", dur: 8, items: [
              { n: "Enfriamiento aeróbico suave", p: "4′" },
              { n: "Registro final de marcas en el cuaderno digital", p: "Check final" }
            ]}
          ]
        }
      }
    }
  ]
};

/* =====================================================================
   VISTA (lee WEEK, no contiene contenido de entrenamiento)
   ===================================================================== */
(function(){
/* Dos formatos conviven: semana de calendario (lun–sáb) o bloque de sesiones secuenciales (s01…s12).
   El formato lo decide el propio track según las claves de su objeto days. */
const WEEKDAYS=[["lun","LUN","Lunes"],["mar","MAR","Martes"],["mie","MIÉ","Miércoles"],["jue","JUE","Jueves"],["vie","VIE","Viernes"],["sab","SÁB","Sábado"]];
const isSeq=t=>Object.keys(t.days||{}).some(k=>/^s\d+$/.test(k));
const daysFor=t=>isSeq(t)?Object.keys(t.days).filter(k=>/^s\d+$/.test(k)).sort((a,b)=>+a.slice(1)-+b.slice(1)).map(k=>{const n=k.slice(1).padStart(2,"0");return [k,"S"+n,"Sesión "+n];}):WEEKDAYS;
let DAYS=WEEKDAYS;
const BLK={warm:["Warm-up","Activación"],str:["Fuerza / Skill","Bloque principal"],met:["Metcon / Intervalos","Acondicionamiento"],acc:["Accesorios","Trabajo complementario"]};
const ORDER=["warm","str","met","acc"];
const MON=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const start=new Date(WEEK.start+"T00:00:00");
const dateOf=i=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;};
const today=new Date();today.setHours(0,0,0,0);
const todayW=WEEKDAYS.findIndex((_,i)=>dateOf(i).getTime()===today.getTime());
let todayIdx=-1;
const wd=today.getDay(); /* 0 dom … 6 sáb */
const autoDay=todayW>=0?WEEKDAYS[todayW][0]:(wd>=1&&wd<=6?WEEKDAYS[wd-1][0]:"lun");

/* estado por espectador */
const KEY="cerebelo-visor-v1";
let st={track:WEEK.tracks[0].id,day:autoDay,done:{},kg:{},closed:{}};
try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);st.track=s.track||st.track;st.done=s.done||{};st.kg=s.kg||{};}}catch(e){}
/* Acceso solo por enlace: #genesis · #hybrid · #apex. Sin hash válido no se muestra ningún programa. */
function readHash(){
  const h=location.hash.replace("#","").toLowerCase();
  const t=WEEK.tracks.find(x=>x.slug===h);
  if(t)st.track=t.id;
  return !!t;
}
let athleteMode=false;
const COACH_KEY="cerebelo-coach-track";
function save(){try{localStorage.setItem(KEY,JSON.stringify({done:st.done,kg:st.kg}));}catch(e){}}
const T=()=>WEEK.tracks.find(t=>t.id===st.track)||WEEK.tracks[0];
const dKey=(d)=>`${WEEK.id}|${st.track}|${d}`;

function renderBoard(){
  const a=dateOf(0),b=dateOf(5);
  const range=a.getMonth()===b.getMonth()?`${pad(a.getDate())}–${pad(b.getDate())} ${MON[a.getMonth()]}`:`${pad(a.getDate())} ${MON[a.getMonth()]}–${pad(b.getDate())} ${MON[b.getMonth()]}`;
  const ph=Array.from({length:WEEK.phases},(_,i)=>`<i class="${i<WEEK.phaseIndex?"on":""}"></i>`).join("");
  $("board").innerHTML=`
    ${isSeq(T())?`<div class="cell"><div class="lbl">Completadas</div><div class="v ice">${pad(DAYS.filter(d=>st.done[dKey(d[0])]).length)}/${pad(DAYS.length)}</div></div>`:`<div class="cell"><div class="lbl">Semana</div><div class="v ice">${esc(WEEK.id)}</div></div>`}
    <div class="cell"><div class="lbl">${esc(WEEK.block)}</div><div class="v">${esc(WEEK.phase.toUpperCase())}</div><div class="phase">${ph}</div></div>
    ${isSeq(T())?`<div class="cell"><div class="lbl">Bloque</div><div class="v">${DAYS.length} SESIONES</div><div class="lbl" style="margin-top:6px;color:var(--ice)">// Progresión cerrada</div></div>`:`<div class="cell"><div class="lbl">Fechas</div><div class="v">${range}</div></div>`}
    <div class="cell"><div class="lbl">Intensidad</div><div class="v" id="bEffort">${esc(T().effort)}</div></div>`;
}
function renderTracks(){
  $("tracks").hidden=athleteMode;
  if(athleteMode){$("tracks").innerHTML="";return;}
  $("tracks").innerHTML=WEEK.tracks.map(t=>`<button type="button" role="tab" class="tr" data-t="${t.id}" aria-selected="${t.id===st.track}">
    <span class="c">${esc(t.code)}</span><span class="n">${esc(t.program)}</span></button>`).join("");
}
function renderDays(){
  $("days").innerHTML=DAYS.map(([k,s],i)=>`<button type="button" role="tab" class="dy${st.done[dKey(k)]?" done":""}" data-d="${k}" aria-selected="${k===st.day}">
    ${i===todayIdx?'<span class="h">HOY</span>':""}${isSeq(T())?`<div class="d">SESIÓN</div><div class="k">${s}</div>`:`<div class="d">${s}</div><div class="k">${pad(dateOf(i).getDate())}</div>`}</button>`).join("");
  const on=$("days").querySelector('[aria-selected="true"]');
  if(on){const s=$("days");s.scrollLeft=on.offsetLeft-s.clientWidth/2+on.clientWidth/2;}
}
function renderTrackInfo(){
  const t=T();
  document.body.dataset.theme=t.theme||"";
  document.title=t.program+" · Programación personal";
  try{let m=document.querySelector('meta[name="theme-color"]');
    if(!m){m=document.createElement("meta");m.name="theme-color";document.head.appendChild(m);}
    m.content={aurora:"#f8fafc",cobalt:"#030d22",solar:"#0c0303"}[t.theme]||"#06090e";}catch(e){}
  const FX={aurora:[" aurora","crystal"],cobalt:["","breath"],solar:[" solar","thermal"]}[t.theme]||["",""];
  const tag=esc(t.tagline||"").replace("//","<b>//</b>");
  $("hero").innerHTML=`<div class="fade"><div class="pulsar${FX[0]}"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="core"></span><h1 class="${FX[1]}">${esc(t.program)}</h1></div>
    <div class="tag">${tag}</div></div>`;
  $("trackinfo").innerHTML=`<div style="min-width:0"><div class="lbl">Vertiente ${t.code} · ${esc(t.name)}</div><p style="margin-top:8px">${esc(t.lead)}</p></div>
    <div class="specs"><span class="chip ice">${t.dur}′ por sesión</span><span class="chip">${esc(t.effort)}</span><span class="chip">${esc(t.kit)}</span></div>`;
  const e=$("bEffort");if(e)e.textContent=t.effort;
}
function item(it,dayK,j,bk){
  const id=`${dayK}-${bk}-${j}`, kk=`${WEEK.id}|${st.track}|${id}`;
  const unit=it.lu||(bk==="met"?"MARCA":"KG");
  const kg=it.log?`<div class="kg"><label for="kg-${id}">${esc(unit)}</label><input id="kg-${id}" inputmode="${unit==="KG"?"decimal":"text"}" data-kk="${kk}" value="${esc(st.kg[kk]||"")}" placeholder="${unit==="KG"?"—":"min:seg"}"></div>`:"";
  return `<div class="it"><div style="min-width:0"><div class="nm">${esc(it.n)}</div>${it.nt?`<div class="nt">${esc(it.nt)}</div>`:""}</div>
    <div class="rx"><span class="p">${esc(it.p)}</span>${it.l?`<span class="l">${esc(it.l)}</span>`:""}${kg}</div></div>`;
}
function renderDay(){
  const t=T(), D=t.days[st.day], di=DAYS.findIndex(d=>d[0]===st.day), date=dateOf(di);
  const total=D.blocks.reduce((a,b)=>a+b.dur,0);
  const tl=D.blocks.map(b=>`<i class="${b.k==="str"?"forge":b.k==="met"?"ice2":""}" style="flex:${b.dur}" title="${BLK[b.k][0]} ${b.dur}′"></i>`).join("");
  const blocks=D.blocks.map((b,bi)=>{
    const ck=`${st.track}|${st.day}|${b.k}`, closed=!!st.closed[ck];
    const sub=b.sub||BLK[b.k][1];
    return `<section class="blk k-${b.k}${closed?" closed":""}">
      <button type="button" class="blk-h" data-ck="${ck}" aria-expanded="${!closed}">
        <span class="ix">${pad(bi+1)}</span><span class="t">${BLK[b.k][0]}<small>${esc(sub)}</small></span><span class="dur">${b.dur}′</span><span class="chev">▼</span>
      </button>
      <div class="blk-b"><div class="blk-in"><div class="blk-pad">
        ${b.fmt?`<div class="fmt"><b>${esc(b.fmt)}</b></div>`:""}
        ${b.items.map((it,j)=>item(it,st.day,j,b.k)).join("")}
        ${b.cue?`<div class="cue">${b.cue}</div>`:""}
      </div></div></div></section>`;
  }).join("");
  const done=!!st.done[dKey(st.day)];
  $("day").innerHTML=`<div class="fade">
    <div class="dayhead"><div style="min-width:0"><div class="lbl">${isSeq(t)?DAYS[di][2]:DAYS[di][2]+" "+pad(date.getDate())+" "+MON[date.getMonth()]} · ${total}′</div><h3>${esc(D.title)}</h3><p class="obj">${esc(D.obj)}</p></div>
      <button type="button" class="donebtn" id="doneBtn" aria-pressed="${done}">${done?"✓ Sesión completada":"Marcar completada"}</button></div>
    <div class="timeline" aria-hidden="true">${tl}</div>
    <div class="blocks">${blocks}</div>
    <nav class="pager"><button type="button" id="prevD" ${di===0?"disabled":""}>← ${di>0?DAYS[di-1][1]:""}</button><button type="button" id="nextD" ${di===DAYS.length-1?"disabled":""}>${di<DAYS.length-1?DAYS[di+1][1]:""} →</button></nav>
  </div>`;
}
function buildStars(){
  const host=$("stars");if(!host||host.childElementCount)return;
  let html="";
  for(let i=0;i<90;i++){
    const s=(Math.random()<.85?1:2)+Math.random()*.6;
    html+=`<i style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;animation-delay:${(Math.random()*4).toFixed(2)}s;animation-duration:${(3+Math.random()*4).toFixed(2)}s"></i>`;
  }
  host.innerHTML=html;
}
buildStars();
/* Ajusta la lista de días/sesiones al track activo y elige qué abrir:
   semana → hoy · bloque → primera sesión sin completar */
function syncDays(){
  const t=T();DAYS=daysFor(t);const seq=isSeq(t);
  todayIdx=seq?-1:todayW;
  if(!DAYS.some(d=>d[0]===st.day)||st._seq!==seq||st._trk!==t.id){
    st.day=seq?((DAYS.find(d=>!st.done[dKey(d[0])])||DAYS[DAYS.length-1])[0]):autoDay;
  }
  st._seq=seq;st._trk=t.id;
}
function all(){syncDays();renderBoard();renderTracks();renderDays();renderTrackInfo();renderDay();}
function switchTrack(id){
  const t=WEEK.tracks.find(x=>x.id===id);if(!t||id===st.track)return;
  st.track=id;
  /* vista coach: recuerda la vertiente sin escribir hash (un hash activaría el modo atleta) */
  try{localStorage.setItem(COACH_KEY,id);}catch(e){}
  syncDays();renderTracks();renderBoard();renderDays();renderTrackInfo();renderDay();
}

/* ===== PROTOCOL BOOT ===== */
/* Emblema CEREBELO: kettlebell con núcleo de energía. Toma el color de la vertiente activa. */
const BRAND=`<svg viewBox="0 0 100 100" aria-hidden="true">
  <defs><radialGradient id="kbCore" cx="50%" cy="58%" r="50%"><stop offset="0" stop-color="currentColor" stop-opacity=".55"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient></defs>
  <path d="M27 46C20 25 31 8 50 8s30 17 23 38" stroke-width="3.4"/>
  <path d="M37 41c-4-13 2-23 13-23s17 10 13 23" stroke-width="2.2"/>
  <path class="kb-body" d="M28 44C20 50 15 58 15 67c0 10 6 18 15 23h40c9-5 15-13 15-23 0-9-5-17-13-23-6-4-14-6-22-6s-16 2-22 6z" stroke-width="3.2"/>
  <path d="M31 90h38" stroke-width="3.6"/>
  <path d="M24 61c3-7 9-12 16-14" stroke-width="2.2" opacity=".75"/>
  <circle class="glow" cx="50" cy="66" r="6.5"/>
  <circle cx="50" cy="66" r="13" stroke-width="1.5" stroke-dasharray="3 4" opacity=".85"/>
</svg>`;
const bootKey=()=>`cerebelo-boot-v1|${T().slug}|${WEEK.id}`;
function bootSeen(){try{return localStorage.getItem(bootKey())==="1";}catch(e){return false;}}
function showBoot(){
  const b=$("boot"),t=T();
  const FX={aurora:[" aurora","crystal"],cobalt:["","breath"],solar:[" solar","thermal"]}[t.theme]||["",""];
  const brief=(t.briefing||[t.lead]).map(p=>`<p>${p}</p>`).join("");
  b.innerHTML=`<div class="boot-in">
    <div class="badge"><i></i>Acceso beta privado // Protocolo de testeo</div>
    <div class="emblem pulsar power${FX[0]}"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="core"></span>${BRAND}</div>
    <h1 id="bootTitle" class="${FX[1]}">${esc(t.program)}</h1>
    <div class="tag">${esc(t.tagline||"").replace("//","<b>//</b>")}</div>
    <div class="crawl" tabindex="0" aria-label="Manifiesto del programa"><div class="crawl-tilt"><div class="crawl-text">
      <p class="ep">${esc(WEEK.block)} · ${isSeq(t)?daysFor(t).length+" sesiones":"Semana "+esc(WEEK.id)} · ${esc(WEEK.phase)}</p>
      <p class="ep-t">${esc(t.name)}</p>${brief}</div></div></div>
    <div class="boot-dock"><button type="button" class="boot-go" id="bootGo">[ ENTRAR AL ENTRENAMIENTO ]</button>
      <div class="boot-meta">${esc(t.code)} · ${esc(t.program)} · ${t.dur}′ por sesión</div></div></div>`;
  b.hidden=false;b.classList.remove("out");document.body.classList.add("booting");
  const go=$("bootGo");if(go)setTimeout(()=>{try{go.focus({preventScroll:true});}catch(e){}},50);
}
function closeBoot(){
  try{localStorage.setItem(bootKey(),"1");}catch(e){}
  const b=$("boot");b.classList.add("out");document.body.classList.remove("booting");
  setTimeout(()=>{if(b.classList.contains("out"))b.hidden=true;},820);
  window.scrollTo(0,0);
}
const DEFAULT_SLUG="hybrid";
function boot(){
  /* Con #genesis · #hybrid · #apex → modo atleta: solo su vertiente, sin selector.
     Sin hash → vista coach: selector visible, arranca en la última vertiente usada o en HYBRID. */
  athleteMode=readHash();
  if(!athleteMode){
    let id=null;try{id=localStorage.getItem(COACH_KEY);}catch(e){}
    const t=WEEK.tracks.find(x=>x.id===id)||WEEK.tracks.find(x=>x.slug===DEFAULT_SLUG)||WEEK.tracks[0];st.track=t.id;
  }
  all();
  if(!bootSeen())showBoot(false);else{$("boot").hidden=true;document.body.classList.remove("booting");}
}
function goDay(k){st.day=k;renderDays();renderDay();}

document.addEventListener("click",e=>{
  if(e.target.closest("#bootGo")){closeBoot();return;}
  if(e.target.closest("#replay")){showBoot();return;}
  const tb=e.target.closest("[data-t]");if(tb){switchTrack(tb.dataset.t);return;}
  const d=e.target.closest("[data-d]");if(d){goDay(d.dataset.d);return;}
  const h=e.target.closest("[data-ck]");if(h){const k=h.dataset.ck;st.closed[k]=!st.closed[k];const s=h.closest(".blk");s.classList.toggle("closed",st.closed[k]);h.setAttribute("aria-expanded",!st.closed[k]);return;}
  if(e.target.closest("#doneBtn")){const k=dKey(st.day);st.done[k]=!st.done[k];save();renderBoard();renderDays();renderDay();return;}
  const i=DAYS.findIndex(x=>x[0]===st.day);
  if(e.target.closest("#prevD")&&i>0){goDay(DAYS[i-1][0]);return;}
  if(e.target.closest("#nextD")&&i<DAYS.length-1){goDay(DAYS[i+1][0]);return;}
});
window.addEventListener("hashchange",boot);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("boot").hidden)closeBoot();});
document.addEventListener("input",e=>{const k=e.target.dataset.kk;if(k){st.kg[k]=e.target.value.trim();save();}});
document.body.classList.add("no-tr");
boot();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove("no-tr")));
})();
</script>
